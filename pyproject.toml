[project]
# Named for what it is. The directory is still "Unmute" for historical
# reasons, but Unmute itself was dropped from the design: it is x86_64/CUDA
# only and cannot run on Apple Silicon. See docs/superpowers/specs/ for why.
name = "voice-agent"
version = "0.1.0"
description = "Local-only conversational voice agent: Pipecat + MLX Whisper + Ollama + Kokoro"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # Serves the browser client at http://localhost:7860 -- that tab is the
    # microphone and speaker, and supplies the echo cancellation.
    "pipecat-ai-prebuilt>=1.0.5",
    # The `whisper` extra is required alongside `mlx-whisper`: pipecat 1.7.0's
    # whisper module imports faster_whisper at top level, so an MLX-only
    # install cannot import it at all. See spec section 11.
    "pipecat-ai[kokoro,local-smart-turn,mcp,mlx-whisper,openai,silero,webrtc,whisper]==1.7.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
voice-agent = "voice_agent.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
